# Publish docs/ as an AI-readable reference site on GitHub Pages

# The docs/ markdown set is the primary reference for coding agents; this
# workflow renders it (docs/build.py: link checks + HTML) and deploys it.
# One-time repo setting required: Settings -> Pages -> Source = GitHub Actions.
# Only push/dispatch: the site has no PR state, and a PR-triggered job would
# join the checks the driver and auto-merge wait on for no benefit.

name: Docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel a deployment already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build docs site
        run: |
          python3 -m venv /tmp/docs-venv
          /tmp/docs-venv/bin/pip install --disable-pip-version-check -q pipenv
          PIPENV_IGNORE_VIRTUALENVS=1 PIPENV_VENV_IN_PROJECT=1 \
            /tmp/docs-venv/bin/pipenv install --deploy
          PIPENV_IGNORE_VIRTUALENVS=1 PIPENV_VENV_IN_PROJECT=1 \
            /tmp/docs-venv/bin/pipenv run python3 docs/build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
