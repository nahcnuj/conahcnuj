name: Windows install (opencode + install.ps1)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-install:
    name: Windows install opencode and verify gh auth via opencode
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      APP_ID: ${{ secrets.APP_ID }}
      INSTALLATION_ID: ${{ secrets.INSTALLATION_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install opencode
        uses: ./.github/actions/install-opencode

      - name: Install plugin via install.ps1
        shell: pwsh
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./install.ps1

      - name: Stage app.env for gh auth
        shell: bash
        run: |
          set -e
          dest="$HOME/.config/opencode"
          mkdir -p "$dest/gh-app"
          printf '%s\n' "$PRIVATE_KEY" > "$dest/gh-app/private.pem"
          cat > "$dest/gh-app/app.env" <<EOF
          APP_ID=${APP_ID}
          INSTALLATION_ID=${INSTALLATION_ID}
          APP_SLUG=conahcnuj
          PRIVATE_KEY_PATH=${dest}/gh-app/private.pem
          BASH_EXE=C:/Program Files/Git/bin/bash.exe
          EOF

      - name: Verify gh auth through opencode
        shell: bash
        run: |
          set -e
          out="${RUNNER_TEMP}/opencode-gh-auth.jsonl"
          err="${RUNNER_TEMP}/opencode-gh-auth.err"
          timeout 180s opencode run --auto --format json --model opencode/mimo-v2.6-flash-free \
            "Run the command \`gh auth status\` and report whether it succeeded." \
            > "$out" 2> "$err" || true

          echo "=== stdout ==="
          cat "$out" 2>/dev/null || true
          echo "=== stderr ==="
          cat "$err" 2>/dev/null || true
          if grep -qi "Logged in" "$out" 2>/dev/null || grep -qi "conahcnuj\[bot\]" "$out" 2>/dev/null; then
            echo "opencode gh auth OK"
            exit 0
          fi


          echo "opencode gh auth FAILED"
          exit 1
