name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-bash:
    name: Lint shell scripts
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install shellcheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck already installed"
          elif command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          elif command -v choco >/dev/null 2>&1; then
            choco install shellcheck --yes --no-progress
          else
            echo "no package manager available to install shellcheck" >&2
            exit 1
          fi
          shellcheck --version | head -n 1

      - name: Syntax check
        run: bash -n gh-app/*.sh gh-app/tests/*.sh bin/*.sh lib/*.sh tests/*.sh test.sh

      - name: ShellCheck
        run: shellcheck -x gh-app/*.sh gh-app/tests/*.sh bin/*.sh lib/*.sh tests/*.sh test.sh

  lint-ps:
    name: Check install.ps1 syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "install.ps1"),
            [ref]$tokens,
            [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "install.ps1 parsed OK"

  install-test:
    name: install.ps1 deployment test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run install into temp dir
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "opencode-deploy-test"
          & ./install.ps1 -Destination $dest

      - name: Verify deployed files
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "opencode-deploy-test"
          $required = @(
            "gh-app/get-token.sh",
            "gh-app/git-credential-helper.sh",
            "gh-app/setup-git.sh",
            "gh-app/api-commit.sh",
            "gh-app/bot-user-id.sh",
            "gh-app/app.env.example",
            "plugins/gh-app-token.ts"
          )
          foreach ($rel in $required) {
            $p = Join-Path $dest $rel
            if (-not (Test-Path -LiteralPath $p)) {
              Write-Error "missing: $rel"
              exit 1
            }
            $srcHash = (Get-FileHash -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $rel)).Hash
            if ((Get-FileHash -LiteralPath $p).Hash -ne $srcHash) {
              Write-Error "content mismatch: $rel"
              exit 1
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $dest "gh-app/app.env"))) {
            Write-Error "app.env was not created from example"
            exit 1
          }
          # Only gh-app-token.ts may live in the deployed plugins dir:
          # package.json/lock, tsconfig, node_modules are local typecheck
          # tooling and must never be deployed. @( ) because a single
          # result has no .Count.
          $deployedPlugins = @(Get-ChildItem -LiteralPath (Join-Path $dest "plugins") -File |
            Select-Object -ExpandProperty Name)
          if ($deployedPlugins.Count -ne 1 -or $deployedPlugins[0] -ne "gh-app-token.ts") {
            Write-Error "unexpected plugins payload: $($deployedPlugins -join ', ')"
            exit 1
          }
          # bin-side deployment: the conahcnuj driver resolves gh-app/lib
          # relative to itself, so they must mirror the repo sources.
          $binDir = Join-Path $HOME ".local/bin"
          $binSide = Split-Path $binDir -Parent
          $pairs = @(
            @($dest, "gh-app/get-token.sh", "gh-app/get-token.sh"),
            @($dest, "gh-app/git-credential-helper.sh", "gh-app/git-credential-helper.sh"),
            @($dest, "gh-app/setup-git.sh", "gh-app/setup-git.sh"),
            @($dest, "gh-app/api-commit.sh", "gh-app/api-commit.sh"),
            @($dest, "gh-app/bot-user-id.sh", "gh-app/bot-user-id.sh"),
            @($dest, "gh-app/app.env.example", "gh-app/app.env.example"),
            @($dest, "plugins/gh-app-token.ts", "plugins/gh-app-token.ts"),
            @($binSide, "gh-app/get-token.sh", "gh-app/get-token.sh"),
            @($binSide, "gh-app/setup-git.sh", "gh-app/setup-git.sh"),
            @($binSide, "gh-app/api-commit.sh", "gh-app/api-commit.sh"),
            @($binSide, "lib/gh-api.sh", "lib/gh-api.sh"),
            @($binSide, "lib/opencode.sh", "lib/opencode.sh"),
            @($binSide, "lib/rate-limit.sh", "lib/rate-limit.sh"),
            @($binDir, "conahcnuj", "bin/conahcnuj.sh")
          )
          foreach ($p in $pairs) {
            $deployed = Join-Path $p[0] $p[1]
            if (-not (Test-Path -LiteralPath $deployed)) {
              Write-Error "missing deployment: $($p[1]) under $($p[0])"
              exit 1
            }
            $srcHash = (Get-FileHash -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $p[2])).Hash
            if ((Get-FileHash -LiteralPath $deployed).Hash -ne $srcHash) {
              Write-Error "content mismatch: $deployed (source $($p[2]))"
              exit 1
            }
          }
          Write-Host "all files deployed OK"

  mock-test:
    name: Mock tests (no secrets / no network)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Full offline suite: token cache, credential helper, api-commit.sh
      # arg validation and --dry-run worktree collection (gh-app/tests/).
      - name: Run tests/run.sh suite
        run: bash gh-app/tests/run.sh

      # Driver suite: conahcnuj end-to-end flow tests driven by a mocked
      # API tape + mocked opencode (bin/, lib/, tests/, no secrets,
      # no network).
      - name: Run driver test suite
        run: bash test.sh

  lint-ts:
    name: Typecheck opencode plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Cache npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('plugins/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # @types/node + @opencode-ai/plugin from npm (pinned lockfile).
      # NOTE: plain `cd`, not `npm --prefix`: native npm on Windows
      # ignores an msys-style absolute prefix.
      - name: Typecheck plugin
        run: |
          cd plugins
          npm ci --no-audit --no-fund
          ./node_modules/.bin/tsc -p ../plugins --noEmit

  plugin-smoke:
    name: Plugin runtime smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    # Real IDs when the repo defines them, else fakes. No private key needed.
    env:
      APP_ID: ${{ secrets.APP_ID }}
      INSTALLATION_ID: ${{ secrets.INSTALLATION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Cache npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('plugins/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # Compiles the plugin, loads it against a fake gh-app dir (fake
      # app.env overlaid), and asserts the shell.env contract (GIT_CONFIG
      # identity + alias.vc) and the git-commit redirect.
      # Needs node/npm from the runner; no secrets, no GitHub network.
      - name: Run plugin smoke test
        run: bash test/smoke.sh

  e2e-opencode:
    name: E2E opencode run (opencode free model)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # No pinned version: resolve latest via the authenticated API
      # (unauthenticated api.github.com calls get rate-limited on runners),
      # shared with issue-driver.yml through the install-opencode action.
      - name: Install opencode
        uses: ./.github/actions/install-opencode

      # Install exactly like a user would, into a temp dir.
      - name: Install plugin via install.ps1
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass \
            -File ./install.ps1 -Destination "$RUNNER_TEMP/e2e-inst"

      # app.env over the installed copy: IDs come straight from repo
      # secrets; no private key is ever needed (no token is issued here).
      # The bot ID itself is auto-resolved from the public API.
      # No provider config needed: opencode's own free models need no key.
      - name: Stage app.env and model config
        run: |
          cat > "$RUNNER_TEMP/e2e-inst/gh-app/app.env" <<EOF
          APP_ID=${{ secrets.APP_ID }}
          INSTALLATION_ID=${{ secrets.INSTALLATION_ID }}
          APP_SLUG=conahcnuj
          PRIVATE_KEY_PATH=/tmp/nonexistent.pem
          EOF
          # Seed the bot-ID cache: the public lookup shares runner IPs and
          # gets rate-limited; the ID itself is immutable public info.
          printf '331119074' > "$RUNNER_TEMP/e2e-inst/gh-app/bot-id.cache"
          cat > "$RUNNER_TEMP/e2e-inst/opencode.json" <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "opencode/mimo-v2.5-free"
          }
          EOF

      # Fixture repo (no AGENTS.md, no remote): the agent can only discover
      # `git vc` through the plugin hook, not repo docs. A repo without a
      # remote also keeps every git operation strictly local.
      - name: Stage fixture repo with a staged change
        run: |
          pushd "$RUNNER_TEMP" >/dev/null || exit 1
          mkdir -p e2e-fixture
          pushd e2e-fixture >/dev/null || exit 1
          git init -q
          git config user.email "e2e@test"
          git config user.name "e2e"
          printf 'hello\n' > file.txt
          git add -A
          git commit -qm init
          printf 'change\n' >> file.txt
          git add file.txt
          popd >/dev/null || exit 1
          popd >/dev/null || exit 1

      # Real `opencode run`: use the first model from `opencode models` as
      # the primary/default (explicit --model), then try the rest.
      # JSON events let us assert both halves: `git vc` surfaced AND no
      # tool call died abnormally. Exit 2 is the sandbox norm
      # (api-commit.sh cannot auto-detect owner/repo in a fixture with
      # no remote); anything else fails the run.
      - name: Run opencode and assert git vc surfaces
        run: |
          bash test/e2e-opencode.sh