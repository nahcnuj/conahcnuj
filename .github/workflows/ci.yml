name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-bash:
    name: Lint shell scripts
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install shellcheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck already installed"
          elif command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          elif command -v choco >/dev/null 2>&1; then
            choco install shellcheck --yes --no-progress
          else
            echo "no package manager available to install shellcheck" >&2
            exit 1
          fi
          shellcheck --version | head -n 1

      - name: Syntax check
        run: bash -n gh-app/*.sh

      - name: ShellCheck
        run: shellcheck -x gh-app/*.sh

  lint-ps:
    name: Check install.ps1 syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "install.ps1"),
            [ref]$tokens,
            [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "install.ps1 parsed OK"

  install-test:
    name: install.ps1 deployment test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run install into temp dir
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "opencode-deploy-test"
          & ./install.ps1 -Destination $dest

      - name: Verify deployed files
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "opencode-deploy-test"
          $required = @(
            "gh-app/get-token.sh",
            "gh-app/git-credential-helper.sh",
            "gh-app/setup-git.sh",
            "gh-app/app.env.example",
            "plugins/gh-app-token.ts"
          )
          foreach ($rel in $required) {
            $p = Join-Path $dest $rel
            if (-not (Test-Path -LiteralPath $p)) {
              Write-Error "missing: $rel"
              exit 1
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $dest "gh-app/app.env"))) {
            Write-Error "app.env was not created from example"
            exit 1
          }
          Write-Host "all files deployed OK"

  mock-test:
    name: Mock tests (no secrets / no network)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Cache-hit path returns token without key/network
        run: |
          T="$(mktemp -d)"
          cp gh-app/*.sh "$T/"
          printf 'APP_ID=00000\nINSTALLATION_ID=00000\nAPP_SLUG=conahcnuj\nPRIVATE_KEY_PATH=/tmp/nonexistent.pem\nBASH_EXE="C:/Program Files/Git/bin/bash.exe"\n' > "$T/app.env"
          EXPIRES="$(( $(date +%s) + 3600 ))"
          printf '%s|%s' "$EXPIRES" "ghs_mock_token_abc" > "$T/token.cache"
          OUT="$(bash "$T/get-token.sh")"
          test "$OUT" = "ghs_mock_token_abc"
          echo "cache-hit returns cached token OK"

      - name: Expired cache is not reused
        run: |
          T="$(mktemp -d)"
          cp gh-app/*.sh "$T/"
          printf 'APP_ID=00000\nINSTALLATION_ID=00000\nAPP_SLUG=conahcnuj\nPRIVATE_KEY_PATH=/tmp/nonexistent.pem\nBASH_EXE="C:/Program Files/Git/bin/bash.exe"\n' > "$T/app.env"
          EXPIRES="$(( $(date +%s) - 3600 ))"
          printf '%s|%s' "$EXPIRES" "ghs_expired_token" > "$T/token.cache"
          OUT="$(bash "$T/get-token.sh" 2>&1 || true)"
          case "$OUT" in
            *ghs_expired_token*) echo "ERROR: expired cache reused" >&2; exit 1 ;;
            *) echo "expired cache rejected OK" ;;
          esac

      - name: Credential helper emits username/password (cached token)
        run: |
          T="$(mktemp -d)"
          cp gh-app/*.sh "$T/"
          printf 'APP_ID=00000\nINSTALLATION_ID=00000\nAPP_SLUG=conahcnuj\nPRIVATE_KEY_PATH=/tmp/nonexistent.pem\nBASH_EXE="C:/Program Files/Git/bin/bash.exe"\n' > "$T/app.env"
          EXPIRES="$(( $(date +%s) + 3600 ))"
          printf '%s|%s' "$EXPIRES" "ghs_mock_token_abc" > "$T/token.cache"
          OUT="$(printf 'protocol=https\nhost=github.com\n\n' | bash "$T/git-credential-helper.sh" get)"
          echo "$OUT" | grep -q '^username=x-access-token$'
          echo "$OUT" | grep -q '^password=ghs_mock_token_abc$'
          test "$(echo "$OUT" | wc -l)" -eq 2
          echo "credential helper output OK"