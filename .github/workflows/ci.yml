name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-bash:
    name: Lint shell scripts
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install shellcheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck already installed"
          elif command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          elif command -v choco >/dev/null 2>&1; then
            choco install shellcheck --yes --no-progress
          else
            echo "no package manager available to install shellcheck" >&2
            exit 1
          fi
          shellcheck --version | head -n 1

      - name: Syntax check
        run: bash -n gh-app/*.sh gh-app/tests/*.sh

      - name: ShellCheck
        run: shellcheck -x gh-app/*.sh gh-app/tests/*.sh

  lint-ps:
    name: Check install.ps1 syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "install.ps1"),
            [ref]$tokens,
            [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "install.ps1 parsed OK"

  install-test:
    name: install.ps1 deployment test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run install into temp dir
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "opencode-deploy-test"
          & ./install.ps1 -Destination $dest

      - name: Verify deployed files
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "opencode-deploy-test"
          $required = @(
            "gh-app/get-token.sh",
            "gh-app/git-credential-helper.sh",
            "gh-app/setup-git.sh",
            "gh-app/api-commit.sh",
            "gh-app/bot-user-id.sh",
            "gh-app/mock-test.sh",
            "gh-app/app.env.example",
            "plugins/gh-app-token.ts"
          )
          foreach ($rel in $required) {
            $p = Join-Path $dest $rel
            if (-not (Test-Path -LiteralPath $p)) {
              Write-Error "missing: $rel"
              exit 1
            }
            $srcHash = (Get-FileHash -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $rel)).Hash
            if ((Get-FileHash -LiteralPath $p).Hash -ne $srcHash) {
              Write-Error "content mismatch: $rel"
              exit 1
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $dest "gh-app/app.env"))) {
            Write-Error "app.env was not created from example"
            exit 1
          }
          Write-Host "all files deployed OK"

  mock-test:
    name: Mock tests (no secrets / no network)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Full offline suite: token cache, credential helper, api-commit.sh
      # arg validation and --dry-run worktree collection (gh-app/tests/).
      - name: Run mock-test.sh suite
        run: bash gh-app/mock-test.sh

  lint-ts:
    name: Typecheck opencode plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # @types/node from npm; @opencode-ai/plugin from the offline stub
      # (plugins/plugin-stub.d.ts). NOTE: plain `cd`, not `npm --prefix`:
      # native npm on Windows ignores an msys-style absolute prefix.
      - name: Typecheck plugin
        run: |
          cd plugins
          npm ci --no-audit --no-fund
          npm exec -- tsc -p ../plugins --noEmit

  plugin-smoke:
    name: Plugin runtime smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    # Real IDs when the repo defines them, else fakes. No private key needed.
    env:
      APP_ID: ${{ secrets.APP_ID }}
      INSTALLATION_ID: ${{ secrets.INSTALLATION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Compiles the plugin, loads it against a fake gh-app dir (fake
      # app.env overlaid), and asserts the shell.env contract (GIT_CONFIG
      # identity + alias.vc) and the git-commit redirect.
      # Needs node/npm from the runner; no secrets, no GitHub network.
      - name: Run plugin smoke test
        run: bash plugins/smoke.sh

  e2e-opencode:
    name: E2E opencode run (stub model)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # APP_ID etc. come from repo secrets when present (else self-explanatory
    # fakes). No private key is ever needed: no token is issued in this flow.
    env:
      E2E_APP_ID: ${{ secrets.APP_ID }}
      E2E_INSTALLATION_ID: ${{ secrets.INSTALLATION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Install exactly like a user would, into a temp dir.
      - name: Install plugin via install.ps1
        run: |
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass \
            -File ./install.ps1 -Destination "$RUNNER_TEMP/e2e-inst"
          test -f "$RUNNER_TEMP/e2e-inst/plugins/gh-app-token.ts"
          test -f "$RUNNER_TEMP/e2e-inst/gh-app/api-commit.sh"

      # Fake app.env over the installed copy (BOT_USER_ID wins over
      # auto-resolve; bogus BASH_EXE keeps get-token.sh from running).
      - name: Stage fake app.env and stub provider config
        run: |
          cat > "$RUNNER_TEMP/e2e-inst/gh-app/app.env" <<EOF
          APP_ID=${E2E_APP_ID:-00000}
          BOT_USER_ID=999
          INSTALLATION_ID=${E2E_INSTALLATION_ID:-00000}
          APP_SLUG=smokeapp
          PRIVATE_KEY_PATH=/tmp/nonexistent.pem
          BASH_EXE=/nonexistent-bash
          EOF
          cat > "$RUNNER_TEMP/e2e-inst/opencode.json" <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "stub/e2e-stub",
            "provider": {
              "stub": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "e2e stub (local)",
                "options": { "baseURL": "http://127.0.0.1:18081/v1", "apiKey": "dummy" },
                "models": { "e2e-stub": { "name": "e2e stub" } }
              }
            }
          }
          EOF

      # Fixture repo (no AGENTS.md): the agent can only discover `git vc`
      # through the plugin hook, not repo docs.
      - name: Stage fixture repo with a staged change
        run: |
          FIX="$RUNNER_TEMP/e2e-fixture"
          mkdir -p "$FIX"
          git -C "$FIX" init -q
          git -C "$FIX" config user.email "e2e@test"
          git -C "$FIX" config user.name "e2e"
          printf 'hello\n' > "$FIX/file.txt"
          git -C "$FIX" add -A
          git -C "$FIX" commit -qm init
          printf 'change\n' >> "$FIX/file.txt"
          git -C "$FIX" add file.txt

      # Real `opencode run` against a scripted local stub model (e2e/stub.js
      # makes exactly one tool call: bash `git commit`). The `git vc` string
      # in the output can only originate from the REAL plugin hook blocking
      # `git commit`, proving install -> load -> env -> hook end to end.
      - name: Run opencode and assert git vc surfaces
        run: |
          node e2e/stub.js 18081 >/dev/null 2>&1 &
          SRV_PID=$!
          trap 'kill "$SRV_PID" 2>/dev/null || true' EXIT
          for ((i = 0; i < 30; i++)); do
            if (echo > /dev/tcp/127.0.0.1/18081) >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          OUT="$(OPENCODE_CONFIG_DIR="$RUNNER_TEMP/e2e-inst" \
            OPENCODE_DISABLE_AUTOUPDATE=true \
            OPENCODE_DISABLE_MODELS_FETCH=true \
            timeout 240 opencode run --dir "$RUNNER_TEMP/e2e-fixture" --title e2e \
            "Commit the staged changes with message e2e test" 2>&1 || true)"
          echo "$OUT" | tail -15
          if [[ "$OUT" != *"git vc"* ]]; then
            echo "E2E FAIL: 'git vc' not found in opencode output" >&2
            exit 1
          fi
          echo "E2E OK: 'git vc' surfaced naturally in a real opencode session"