name: Discussion auto-triage

# When a bug-report discussion is opened, investigate it and turn it into work
# the driver can resolve: the triage run reads the report, has the coding agent
# reproduce and pin down the defect, and then either files the issue (which
# issue-driver.yml picks up like any other issue) or posts the verdict on the
# thread ("not a bug", "already tracked", ...).
#
# The trigger is deliberately the discussion and not an issue: the driver files
# its own failures as discussions (see bin/conahcnuj.sh), and a discussion needs
# no tracker to exist before someone can report a failure. The issue comes out
# of the investigation, so nothing is filed that was not checked first.
#
# Recursion is bounded on purpose. This workflow files issues, never
# discussions, so a triage run cannot re-trigger itself. A triage run that dies
# files its bug report under the number-free title "conahcnuj: failed to triage a
# bug report discussion": the second failure appends to that same thread as a
# reply, and a reply fires no trigger, so the chain stops. Bot-authored reports
# are triaged on purpose - the driver's own failures are the reports this
# repository cares about most.
#
# The timeout is controlled on the Actions side, exactly as in
# issue-driver.yml: bump "timeout-minutes" and CONAHCNUJ_MAX_SECONDS together.

on:
  discussion:
    types: [created]
  workflow_dispatch:
    inputs:
      number:
        description: Discussion number to triage
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: conahcnuj-discussion-${{ github.event.discussion.number || inputs.number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage bug report
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: conahcnuj
    # Only the bug report category is triaged; every other category is a normal
    # discussion and must not become an issue. The category name is the repo
    # variable, so renaming it here renames it for the driver's own check too.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'discussion' &&
        (vars.CONAHCNUJ_BUG_REPORT_CATEGORY || 'Bug report') == github.event.discussion.category.name
      )
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # opencode is not preinstalled on runners; shared with ci.yml through the
      # install-opencode composite action (authenticated release lookup so
      # shared runner IPs do not hit the API rate limit).
      - name: Install opencode
        uses: ./.github/actions/install-opencode

      # The driver reads gh-app/app.env like any local run. The private key is
      # staged from the sealed secret, outside the work tree, so `git add -A`
      # can never pick it up.
      - name: Stage App private key and app.env
        env:
          APP_ID: ${{ secrets.APP_ID }}
          INSTALLATION_ID: ${{ secrets.INSTALLATION_ID }}
          APP_SLUG: ${{ secrets.APP_SLUG }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          pem="$RUNNER_TEMP/conahcnuj-app.pem"
          printf '%s\n' "$PRIVATE_KEY" > "$pem"
          chmod 600 "$pem"
          cat > gh-app/app.env <<EOF
          APP_ID="$APP_ID"
          INSTALLATION_ID="$INSTALLATION_ID"
          APP_SLUG="$APP_SLUG"
          PRIVATE_KEY_PATH="$pem"
          BASH_EXE="/usr/bin/bash"
          EOF

      - name: Run the conahcnuj triage
        env:
          CONAHCNUJ_REPO: ${{ github.repository }}
          CONAHCNUJ_INPUT: ${{ github.event.discussion.number || inputs.number }}
          CONAHCNUJ_BUG_REPORT_CATEGORY: ${{ vars.CONAHCNUJ_BUG_REPORT_CATEGORY || 'Bug report' }}
          # Just under the 60-minute job cap so the driver exits gracefully and
          # files its bug report before Actions kills the run.
          CONAHCNUJ_MAX_SECONDS: "3540"
          OPENCODE_DISABLE_AUTOUPDATE: "true"
        run: |
          [[ "${CONAHCNUJ_INPUT}" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid discussion number: ${CONAHCNUJ_INPUT}" >&2; exit 1; }
          bash bin/conahcnuj.sh --discussion "${CONAHCNUJ_INPUT}"
