name: Owner-approved auto-merge

on:
  workflow_call:
    inputs:
      repository:
        description: Repository in owner/name format
        required: true
        type: string
      pr-number:
        description: Pull request number
        required: true
        type: string
      head-sha:
        description: Pull request head commit that received approval
        required: true
        type: string
      merge-method:
        description: Merge method passed to GitHub CLI
        required: false
        default: merge
        type: string
      post-merge-dispatch:
        description: >-
          Workflow to dispatch after the merge succeeds (e.g. cd.yml). GITHUB_TOKEN merges
          do not emit a push event, so deploy workflows need an explicit dispatch.
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: conahcnuj-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
      github.event.review.state == 'approved' &&
      github.event.review.author_association == 'OWNER'
    runs-on: ubuntu-latest
    # CI の完了待ちはこのジョブのポーリング（CHECK_TIMEOUT 秒）で行うため、
    # タイムアウトは checks の待ち時間 + マージの余裕ぶん確保する
    timeout-minutes: 30
    steps:
      - name: Merge and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ inputs.head-sha }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          POST_MERGE_DISPATCH: ${{ inputs.post-merge-dispatch }}
        run: |
          set -euo pipefail

          case "$MERGE_METHOD" in
            merge) MERGE_FLAG=--merge ;;
            squash) MERGE_FLAG=--squash ;;
            rebase) MERGE_FLAG=--rebase ;;
            *)
              echo "unsupported merge method: $MERGE_METHOD" >&2
              exit 1
              ;;
          esac

          pull_request="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          current_head="$(printf '%s' "$pull_request" | jq -r .head.sha)"
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "approved commit $HEAD_SHA is not the current head $current_head; skipping"
            exit 0
          fi

          # ネイティブ auto-merge は integration token では有効化できない
          # （"Resource not accessible by integration"）ため、checks を待って自前で
          # マージする。GITHUB_TOKEN のマージは push イベントを発生させない
          # ので、呼び出し側が post-merge-dispatch でデプロイを起動する。
          #
          # gh pr checks --watch で待つと、このジョブ自身の check run（承認された
          # head SHA に紐付いたまま pending）が永久に終わらないため自己デッドロック
          # する。check runs を API で直接読み、このワークフローの check run を
          # 除外して待つ。
          #
          # 除外するのは「job 名が一致するもの」= 同じチェック名を持つ全実行。
          # owner が承認するたびにこのワークフローは実行され、同じ head SHA に
          # 前実行の failure（あるいは concurrency でキャンセルされた実行の
          # cancelled）が残り続ける。branch rules はこの check を required に
          # していないので、除外しないと 2 回目以降の承認が毎回
          # "checks did not pass" で失敗する（issue #119）。
          CHECK_INTERVAL="${CHECK_INTERVAL:-30}"
          CHECK_TIMEOUT="${CHECK_TIMEOUT:-1500}"
          SELF_RUN="/actions/runs/${GITHUB_RUN_ID}/"
          own_check_names='[]'
          if own_jobs="$(gh api "repos/$REPOSITORY/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" 2>/dev/null \
            | jq -c '[.jobs[]? | .name // empty]')"; then
            own_check_names="${own_jobs:-[]}"
          fi
          echo "ignoring own check runs while waiting: ${own_check_names}"

          outstanding_checks() {
            {
              gh api "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" \
                | jq -r --arg self "$SELF_RUN" --argjson own "${own_check_names}" '
                    [(.check_runs // [])[]
                     | select((.name as $n | ($own | any(. as $on | ($n == $on) or ($n | test("/\\s*"+$on+"\\s*$")) or ($n | test("^\\s*"+$on+"\\s*/")) or ($n | contains($on+" / ")) or ($n | contains(" / "+$on)))) | not))
                     | select(((((.details_url // "") + (.html_url // "")) | contains($self)) | not))
                     | (if .status != "completed" then "pending"
                        elif ((.conclusion // "") | IN("success", "neutral", "skipped")) then ""
                        else "failed" end) as $state
                     | select($state != "")
                     | "\($state)\tcheck\t\(.name)\t\(.conclusion // .status)"]
                    | .[]'
              gh api "repos/$REPOSITORY/commits/$HEAD_SHA/status" \
                | jq -r '
                    [(.statuses // [])[]
                     | (if .state == "pending" then "pending"
                        elif .state == "success" then ""
                        else "failed" end) as $state
                     | select($state != "")
                     | "\($state)\tstatus\t\(.context)\t\(.state)"]
                    | .[]'
            }
          }

          deadline=$(( $(date +%s) + CHECK_TIMEOUT ))
          while true; do
            outstanding="$(outstanding_checks)"
            if [ -z "$outstanding" ]; then
              echo "all checks passed for $REPOSITORY#$PR_NUMBER at $HEAD_SHA"
              break
            fi
            if printf '%s\n' "$outstanding" | grep -q '^failed'; then
              printf '%s\n' "$outstanding" >&2
              echo "checks did not pass for $REPOSITORY#$PR_NUMBER at $HEAD_SHA" >&2
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              printf '%s\n' "$outstanding" >&2
              echo "timed out after ${CHECK_TIMEOUT}s waiting for checks at $HEAD_SHA" >&2
              exit 1
            fi
            echo "waiting for $(printf '%s\n' "$outstanding" | grep -c .) check(s) at $HEAD_SHA"
            printf '%s\n' "$outstanding"
            sleep "$CHECK_INTERVAL"
          done

          if ! merge_output="$(gh pr merge "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            "$MERGE_FLAG" \
            --match-head-commit "$HEAD_SHA" 2>&1)"; then
            printf '%s\n' "$merge_output" >&2
            echo "merge failed for $REPOSITORY#$PR_NUMBER at $HEAD_SHA" >&2
            # branch rules の内容は API から読めないので、どの制約で止まったか
            # （未解決のスレッド・レビュー不足・必須 check など）をログに dump
            # しておく。次回同じ失敗が起きても原因を追えるようにする。
            { gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" \
                | jq -c '{mergeable, merge_state, draft, merged}' || true; } >&2
            echo "if the workflow's check run (e.g. 'enable' or 'enable / enable') is a required status check, remove it from the branch protection rules" >&2
            exit 1
          fi
          printf '%s\n' "$merge_output"

          if [ -n "$POST_MERGE_DISPATCH" ]; then
            echo "dispatching $POST_MERGE_DISPATCH on $REPOSITORY"
            gh workflow run "$POST_MERGE_DISPATCH" --repo "$REPOSITORY"
          fi
