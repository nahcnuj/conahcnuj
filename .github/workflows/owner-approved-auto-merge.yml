name: Owner-approved auto-merge

on:
  workflow_call:
    inputs:
      repository:
        description: Repository in owner/name format
        required: true
        type: string
      pr-number:
        description: Pull request number
        required: true
        type: string
      head-sha:
        description: Pull request head commit that received approval
        required: true
        type: string
      merge-method:
        description: Merge method passed to GitHub CLI
        required: false
        default: merge
        type: string
      post-merge-dispatch:
        description: >-
          Workflow to dispatch after the merge succeeds (e.g. cd.yml). GITHUB_TOKEN merges
          do not emit a push event, so deploy workflows need an explicit dispatch.
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: conahcnuj-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
      github.event.review.state == 'approved' &&
      github.event.review.author_association == 'OWNER'
    runs-on: ubuntu-latest
    # CI の完了待ちはこのジョブのポーリング（CHECK_TIMEOUT 秒）で行うため、
    # タイムアウトは checks の待ち時間 + マージの余裕ぶん確保する
    timeout-minutes: 30
    steps:
      - name: Merge and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ inputs.head-sha }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          POST_MERGE_DISPATCH: ${{ inputs.post-merge-dispatch }}
        run: |
          set -euo pipefail

          case "$MERGE_METHOD" in
            merge) MERGE_FLAG=--merge ;;
            squash) MERGE_FLAG=--squash ;;
            rebase) MERGE_FLAG=--rebase ;;
            *)
              echo "unsupported merge method: $MERGE_METHOD" >&2
              exit 1
              ;;
          esac

          pull_request="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          current_head="$(printf '%s' "$pull_request" | jq -r .head.sha)"
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "approved commit $HEAD_SHA is not the current head $current_head; skipping"
            exit 0
          fi

          # ネイティブ auto-merge は integration token では有効化できない
          # （"Resource not accessible by integration"）ため、checks を待って自前で
          # マージする。GITHUB_TOKEN のマージは push イベントを発生させない
          # ので、呼び出し側が post-merge-dispatch でデプロイを起動する。
          #
          # gh pr checks --watch で待つと、このジョブ自身の check run（承認された
          # head SHA に紐付いたまま pending）が永久に終わらないため自己デッドロック
          # する。checks を API で直接読み、この run のものだけを除いて待つ。
          #
          # このリポジトリのドライバ（Issue auto-drive）も、動いている間だけ head
          # commit に check run を残す。だから ここでその check を待つと両者が
          # 互いを受け待ちになる（issue #115: ドライバはこのジョブの check を制約
          # として待ち、このジョブはドライバの check を待たれて CHECK_TIMEOUT で
          # 失敗する）。ドライバ側も CONAHCNUJ_OWN_WORKFLOWS で同じ workflow 名を
          # 除外しているので（lib/gh-api.sh）、ここでも workflow 名で除外して
          # CI だけを待つ。
          CHECK_INTERVAL=30
          CHECK_TIMEOUT=1500
          SELF_RUN_ID="$GITHUB_RUN_ID"
          IGNORED_WORKFLOWS="${IGNORED_WORKFLOWS:-Issue auto-drive}"
          OWNER="${REPOSITORY%%/*}"
          REPO_NAME="${REPOSITORY#*/}"

          # 残っている check / commit status を 1 行ずつ "pending|failed<TAB>check|
          # status<TAB>名前<TAB>状態" で出す。出力が空なら待てるものは全部 green。
          # workflow 名は REST の check-runs には付かないので GraphQL の
          # statusCheckRollup から取る（commit status も同じ扱いで混ざる）。context を
          # 列挙できないページ / checks の無いコミットは「保留」として待つ（勝手に
          # 「全部 green」と合計すると、そのまま merge してしまう）。
          outstanding_checks() {
            gh api graphql \
              -F owner="$OWNER" \
              -F name="$REPO_NAME" \
              -F sha="$HEAD_SHA" \
              -f query='
                query($owner: String!, $name: String!, $sha: GitObjectID!) {
                  repository(owner: $owner, name: $name) {
                    object(oid: $sha) {
                      ... on Commit {
                        statusCheckRollup {
                          contexts(first: 100) {
                            pageInfo { hasNextPage }
                            nodes {
                              __typename
                              ... on CheckRun {
                                name status conclusion
                                checkSuite {
                                  workflowRun { databaseId workflow { name } }
                                }
                              }
                              ... on StatusContext { context state }
                            }
                          }
                        }
                      }
                    }
                  }
                }' \
              | jq -r \
                  --arg owner "$OWNER" \
                  --arg name "$REPO_NAME" \
                  --arg sha "$HEAD_SHA" \
                  --arg self_run "$SELF_RUN_ID" \
                  --arg ignore "$IGNORED_WORKFLOWS" '
                    .data.repository.object as $object
                    | if $object == null then
                        error("no commit " + $sha + " in " + ($owner + "/" + $name)
                              + "; refusing to merge blind")
                      else $object end
                    | (.statusCheckRollup // null) as $rollup
                    | (
                        if ($rollup == null or ($rollup.contexts.pageInfo.hasNextPage // false))
                        then "pending\tcheck\t(no enumerable check list)\tpending"
                        else empty end,
                        (($rollup.contexts.nodes // [])[]
                          # この run 自身の check は、承認 head に紐付いたまま pending。
                          | select(((.checkSuite.workflowRun.databaseId | tostring) != $self_run))
                          # 除外 workflow の check（このリポジトリのドライバ）も待たない。
                          | select((.checkSuite.workflowRun.workflow.name // "") as $wf
                                   | (($ignore | split(",") | index($wf)) == null))
                          | (if .__typename == "CheckRun"
                             then (if .status != "COMPLETED" then "pending"
                                   elif ((.conclusion // "") | IN("SUCCESS", "NEUTRAL", "SKIPPED")) then ""
                                   else "failed" end)
                             elif .__typename == "StatusContext"
                             then (if .state == "SUCCESS" then ""
                                   elif ((.state // "") | IN("PENDING", "EXPECTED", "")) then "pending"
                                   else "failed" end)
                             # 読み方を知らない context は「保留」扱い（勝手に合計しない）。
                             else "pending" end) as $state
                          | select($state != "")
                          | "\($state)\t\(if .__typename == "CheckRun" then "check" else "status" end)\t\(.name // .context // "unknown context")\t\(.conclusion // .status // .state // "unknown")"
                        )
                      )'
          }

          deadline=$(( $(date +%s) + CHECK_TIMEOUT ))
          while true; do
            outstanding="$(outstanding_checks)"
            if [ -z "$outstanding" ]; then
              echo "all checks passed for $REPOSITORY#$PR_NUMBER at $HEAD_SHA"
              break
            fi
            if printf '%s\n' "$outstanding" | grep -q '^failed'; then
              printf '%s\n' "$outstanding" >&2
              echo "checks did not pass for $REPOSITORY#$PR_NUMBER at $HEAD_SHA" >&2
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              printf '%s\n' "$outstanding" >&2
              echo "timed out after ${CHECK_TIMEOUT}s waiting for checks at $HEAD_SHA" >&2
              exit 1
            fi
            echo "waiting for $(printf '%s\n' "$outstanding" | grep -c .) check(s) at $HEAD_SHA"
            printf '%s\n' "$outstanding"
            sleep "$CHECK_INTERVAL"
          done

          if ! merge_output="$(gh pr merge "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            "$MERGE_FLAG" \
            --match-head-commit "$HEAD_SHA" 2>&1)"; then
            printf '%s\n' "$merge_output" >&2
            echo "merge failed for $REPOSITORY#$PR_NUMBER at $HEAD_SHA" >&2
            # gh prints the reason above. Repository merge policy (branch
            # protection, required checks / reviews) is the owner's setting
            # and is never changed from here, so the log points at the failure
            # only: a suggestion to relax it would reach the coding agent
            # through the driver's bug-report log and be impossible to apply.
            echo "check the reported reason and the branch's protection rules; this workflow does not change them" >&2
            exit 1
          fi
          printf '%s\n' "$merge_output"

          if [ -n "$POST_MERGE_DISPATCH" ]; then
            echo "dispatching $POST_MERGE_DISPATCH on $REPOSITORY"
            gh workflow run "$POST_MERGE_DISPATCH" --repo "$REPOSITORY"
          fi
