name: Owner-approved auto-merge

on:
  workflow_call:
    inputs:
      repository:
        description: Repository in owner/name format
        required: true
        type: string
      pr-number:
        description: Pull request number
        required: true
        type: string
      head-sha:
        description: Pull request head commit that received approval
        required: true
        type: string
      merge-method:
        description: Merge method used when auto-merging
        required: false
        default: merge
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: conahcnuj-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
      github.event.review.state == 'approved' &&
      github.event.review.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ inputs.head-sha }}
          MERGE_METHOD: ${{ inputs.merge-method }}
        run: |
          set -euo pipefail

          # GITHUB_TOKEN でマージするとそのマージ由来の push では workflow が起動しない
          # （再帰実行を防ぐ GitHub の仕様）ため、GitHub 自身がマージする
          # ネイティブ auto-merge を有効化する。
          case "$MERGE_METHOD" in
            merge) MERGE_METHOD_ENUM=MERGE ;;
            squash) MERGE_METHOD_ENUM=SQUASH ;;
            rebase) MERGE_METHOD_ENUM=REBASE ;;
            *)
              echo "unsupported merge method: $MERGE_METHOD" >&2
              exit 1
              ;;
          esac

          pull_request="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          current_head="$(printf '%s' "$pull_request" | jq -r .head.sha)"
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "approved commit $HEAD_SHA is not the current head $current_head; skipping"
            exit 0
          fi
          pull_request_id="$(printf '%s' "$pull_request" | jq -r .node_id)"

          gh api graphql -f query="
            mutation {
              enablePullRequestAutoMerge(
                input: { pullRequestId: \"$pull_request_id\", mergeMethod: $MERGE_METHOD_ENUM }
              ) {
                clientMutationId
              }
            }"
