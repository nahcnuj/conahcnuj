name: Owner-approved auto-merge

on:
  workflow_call:
    inputs:
      repository:
        description: Repository in owner/name format
        required: true
        type: string
      pr-number:
        description: Pull request number
        required: true
        type: string
      head-sha:
        description: Pull request head commit that received approval
        required: true
        type: string
      merge-method:
        description: Merge method passed to GitHub CLI
        required: false
        default: merge
        type: string
    secrets:
      auto-merge-token:
        description: >-
          User token (PAT) used to enable auto-merge. GITHUB_TOKEN cannot:
          the API answers "Resource not accessible by integration", and a
          token-driven merge would not start the caller's on: push workflows.
        required: true

permissions:
  contents: read

concurrency:
  group: conahcnuj-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
      github.event.review.state == 'approved' &&
      github.event.review.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.auto-merge-token }}
          REPOSITORY: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ inputs.head-sha }}
          MERGE_METHOD: ${{ inputs.merge-method }}
        run: |
          set -euo pipefail

          # required secret として宣言しても、caller 側の repository secret が未設定だと
          # 空文字で渡る。auto-merge は「設定されているリポジトリだけ」有効になる機能なので、
          # 未設定は異常ではなく未構成として warning でスキップする（空の token を gh に
          # 渡すと exit 4 になるだけで、原因がログに残らない）。
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning title=auto-merge not configured::no user token secret; add the repository secret named by the caller (e.g. AUTO_MERGE_TOKEN) to enable auto-merge"
            exit 0
          fi

          case "$MERGE_METHOD" in
            merge) MERGE_FLAG=--merge ;;
            squash) MERGE_FLAG=--squash ;;
            rebase) MERGE_FLAG=--rebase ;;
            *)
              echo "unsupported merge method: $MERGE_METHOD" >&2
              exit 1
              ;;
          esac
          gh pr merge "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            "$MERGE_FLAG" \
            --auto \
            --match-head-commit "$HEAD_SHA"
