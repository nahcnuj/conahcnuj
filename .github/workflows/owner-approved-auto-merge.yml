name: Owner-approved auto-merge

on:
  workflow_call:
    inputs:
      repository:
        description: Repository in owner/name format
        required: true
        type: string
      pr-number:
        description: Pull request number
        required: true
        type: string
      head-sha:
        description: Pull request head commit that received approval
        required: true
        type: string
      merge-method:
        description: Merge method passed to GitHub CLI
        required: false
        default: merge
        type: string
      post-merge-dispatch:
        description: >-
          Workflow to dispatch after the merge succeeds (e.g. cd.yml). GITHUB_TOKEN merges
          do not emit a push event, so deploy workflows need an explicit dispatch.
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: conahcnuj-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
      github.event.review.state == 'approved' &&
      github.event.review.author_association == 'OWNER'
    runs-on: ubuntu-latest
    # CI の完了待ちは gh pr checks --watch で行うため、checks の所要時間ぶん確保する
    timeout-minutes: 30
    steps:
      - name: Merge and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ inputs.head-sha }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          POST_MERGE_DISPATCH: ${{ inputs.post-merge-dispatch }}
        run: |
          set -euo pipefail

          case "$MERGE_METHOD" in
            merge) MERGE_FLAG=--merge ;;
            squash) MERGE_FLAG=--squash ;;
            rebase) MERGE_FLAG=--rebase ;;
            *)
              echo "unsupported merge method: $MERGE_METHOD" >&2
              exit 1
              ;;
          esac

          pull_request="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          current_head="$(printf '%s' "$pull_request" | jq -r .head.sha)"
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "approved commit $HEAD_SHA is not the current head $current_head; skipping"
            exit 0
          fi

          # ネイティブ auto-merge は integration token では有効化できない
          # （"Resource not accessible by integration"）ため、checks を待って自前で
          # マージする。GITHUB_TOKEN のマージは push イベントを発生させない
          # ので、呼び出し側が post-merge-dispatch でデプロイを起動する。
          if ! checks_output="$(gh pr checks "$PR_NUMBER" --repo "$REPOSITORY" --watch --interval 30 2>&1)"; then
            if printf '%s' "$checks_output" | grep -q 'no checks reported'; then
              echo 'no checks reported on the PR; merging'
            else
              printf '%s\n' "$checks_output"
              echo "checks did not pass for $REPOSITORY#$PR_NUMBER" >&2
              exit 1
            fi
          else
            printf '%s\n' "$checks_output"
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            "$MERGE_FLAG" \
            --match-head-commit "$HEAD_SHA"

          if [ -n "$POST_MERGE_DISPATCH" ]; then
            echo "dispatching $POST_MERGE_DISPATCH on $REPOSITORY"
            gh workflow run "$POST_MERGE_DISPATCH" --repo "$REPOSITORY"
          fi
