name: Owner-approved auto-merge

on:
  workflow_call:
    inputs:
      repository:
        description: Repository in owner/name format
        required: true
        type: string
      pr-number:
        description: Pull request number
        required: true
        type: string
      head-sha:
        description: Pull request head commit that received approval
        required: true
        type: string
      merge-method:
        description: Merge method passed to GitHub CLI
        required: false
        default: merge
        type: string
      post-merge-dispatch:
        description: >-
          Workflow to dispatch after the merge succeeds (e.g. cd.yml). GITHUB_TOKEN merges
          do not emit a push event, so deploy workflows need an explicit dispatch.
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: conahcnuj-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
      github.event.review.state == 'approved' &&
      github.event.review.author_association == 'OWNER'
    runs-on: ubuntu-latest
    # CI の完了はこのジョブでは待たず、ネイティブ auto-merge（GitHub 側）に任せる
    # （issue #269）。ジョブは 1 〜 2 回の API 呼び出しで終わる。
    timeout-minutes: 10
    steps:
      - name: Merge and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ inputs.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ inputs.head-sha }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          POST_MERGE_DISPATCH: ${{ inputs.post-merge-dispatch }}
        run: |
          set -euo pipefail

          case "$MERGE_METHOD" in
            merge) MERGE_FLAG=--merge ;;
            squash) MERGE_FLAG=--squash ;;
            rebase) MERGE_FLAG=--rebase ;;
            *)
              echo "unsupported merge method: $MERGE_METHOD" >&2
              exit 1
              ;;
          esac

          pull_request="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          current_head="$(printf '%s' "$pull_request" | jq -r .head.sha)"
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "approved commit $HEAD_SHA is not the current head $current_head; skipping"
            exit 0
          fi
          if [ "$(printf '%s' "$pull_request" | jq -r .state)" = "closed" ] &&
             [ "$(printf '%s' "$pull_request" | jq -r .merged)" = "true" ]; then
            echo "PR $REPOSITORY#$PR_NUMBER is already merged; skipping"
            exit 0
          fi

          # 承認された head に一致するときだけ即時マージを試す。CI がまだ green で
          # ない・head が base より遅れているなどの場合は GitHub が即時マージを
          # 拒否する。ここで CI の完了を待つことはしない（issue #269）: そのまま
          # ネイティブ auto-merge を有効化してジョブを終え、条件達成後のマージは
          # GitHub 側に任せる。「merge if it's mergeable, or enable auto-merge」。
          #
          # GITHUB_TOKEN のマージは push イベントを発生させない（#131）ので、実際に
          # マージされたと確認できたときだけ post-merge-dispatch でデプロイを起動
          # する。auto-merge を有効化しただけ（まだマージされていない）場合は起動
          # しない。
          if ! merge_output="$(gh pr merge "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            "$MERGE_FLAG" \
            --match-head-commit "$HEAD_SHA" 2>&1)"; then
            # 即時マージの拒否はこの run の失敗ではない。ネイティブ auto-merge を
            # 有効化してジョブを終える。有効化もできない場合（リポジトリ設定の
            # Allow auto-merge が無効など）のみ失敗として報告する。
            printf '%s\n' "$merge_output" >&2
            if auto_output="$(gh pr merge "$PR_NUMBER" \
              --repo "$REPOSITORY" \
              "$MERGE_FLAG" \
              --auto \
              --match-head-commit "$HEAD_SHA" 2>&1)"; then
              echo "immediate merge was refused; auto-merge is queued for $REPOSITORY#$PR_NUMBER" >&2
              merge_output="${auto_output}"
            else
              printf '%s\n' "$auto_output" >&2
              echo "merge failed for $REPOSITORY#$PR_NUMBER at $HEAD_SHA" >&2
              echo "if 'enable / enable' is a required status check, remove it from the branch protection rules" >&2
              echo "if auto-merge could not be queued either, the repository needs Settings -> General -> Pull Requests -> Allow auto-merge" >&2
              exit 1
            fi
          fi
          printf '%s\n' "$merge_output"

          if [ -n "$POST_MERGE_DISPATCH" ]; then
            state="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json state --jq .state)"
            if [ "$state" = "MERGED" ]; then
              echo "dispatching $POST_MERGE_DISPATCH on $REPOSITORY"
              gh workflow run "$POST_MERGE_DISPATCH" --repo "$REPOSITORY"
            else
              echo "$REPOSITORY#$PR_NUMBER is not merged yet; skipping post-merge dispatch" >&2
            fi
          fi
