name: Issue auto-drive

# When an issue is created, attempt to resolve it with the conahcnuj driver
# end-to-end (feature branch -> PR -> review feedback) and end with a
# ready-to-merge PR, or file a bug-report issue on failure.
#
# The timeout is controlled on the Actions side: "timeout-minutes" below is
# the hard cap for the whole job, and CONAHCNUJ_MAX_SECONDS is kept just under
# it so the driver wraps up on its own and files its bug report (exit 1)
# before the runner kills the job. Bump both together when changing the budget.
#
# Least privilege for GITHUB_TOKEN: contents: read is all the runner needs for
# checkout and the opencode install. Every write the driver performs (feature
# branch, Verified commits, PR, review requests, comments, bug-report issues)
# goes through the GitHub App installation token from gh-app/get-token.sh,
# exactly like a local run.

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: conahcnuj-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  attempt:
    name: Attempt to resolve issue
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: conahcnuj
    # Do not chase the driver's own outputs: bug-report issues are authored by
    # <APP_SLUG>[bot], and running the driver on them would loop forever. All
    # four secrets are required for the run to be meaningful.
    if: >-
      github.event.issue.user.login != format('{0}[bot]', secrets.APP_SLUG) &&
      secrets.APP_ID != '' && secrets.INSTALLATION_ID != '' &&
      secrets.APP_SLUG != '' && secrets.PRIVATE_KEY != ''
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # opencode is not preinstalled on runners; resolved the same way the
      # e2e-opencode job does (authenticated release lookup, free model).
      - name: Install opencode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/anomalyco/opencode/releases/latest | sed -n 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
          VER="${TAG#v}"
          test -n "$VER"
          curl -fsSL https://opencode.ai/install | bash -s -- --version "$VER"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # The driver reads gh-app/app.env like any local run. The private key is
      # staged from the sealed secret, outside the work tree, so `git add -A`
      # can never pick it up.
      - name: Stage App private key and app.env
        env:
          APP_ID: ${{ secrets.APP_ID }}
          INSTALLATION_ID: ${{ secrets.INSTALLATION_ID }}
          APP_SLUG: ${{ secrets.APP_SLUG }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          pem="$RUNNER_TEMP/conahcnuj-app.pem"
          printf '%s\n' "$PRIVATE_KEY" > "$pem"
          chmod 600 "$pem"
          cat > gh-app/app.env <<EOF
          APP_ID="$APP_ID"
          INSTALLATION_ID="$INSTALLATION_ID"
          APP_SLUG="$APP_SLUG"
          PRIVATE_KEY_PATH="$pem"
          BASH_EXE="/usr/bin/bash"
          EOF

      - name: Run the conahcnuj driver
        env:
          CONAHCNUJ_REPO: ${{ github.repository }}
          # Just under the 60-minute job cap so the driver exits gracefully
          # and files its bug report before Actions kills the run.
          CONAHCNUJ_MAX_SECONDS: "3540"
          OPENCODE_DISABLE_AUTOUPDATE: "true"
        run: |
          bash bin/conahcnuj.sh "${{ github.event.issue.number }}"
