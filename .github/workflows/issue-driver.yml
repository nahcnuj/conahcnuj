name: Issue auto-drive

# When an issue is created or reopened, a non-approval review is submitted,
# edited, or dismissed, a required check (the CI workflow) fails on a pull
# request, the workflow is dispatched by hand, or another repository's workflow
# calls this one (`workflow_call` with a `number` input), attempt to resolve it
# with the conahcnuj driver end-to-end (feature branch -> PR -> review feedback)
# and end with a ready-to-merge PR, or file a bug-report issue on failure.
#
# Reusable use checks out this workflow's own repository
# (`job.workflow_repository` at `job.workflow_sha`) for the driver scripts and
# drives the issue or PR in the caller's repository (`inputs.repository`,
# defaulting to the caller). When the target is not the driver's own repository
# the target is checked out again into the working directory and the driver runs
# from there, so its git operations (branch, fetch, Verified commits) and the
# coding agent's edits all act on the target, exactly like makamujo's local
# auto-drive pattern; the caller needs no copy of the driver.
# The caller passes the GitHub App secrets (`secrets: inherit` within the same
# organization or enterprise, named secrets otherwise); the job-level
# `environment` (default `conahcnuj`, overridable with `inputs.environment`)
# still decides which environment secrets win over the passed ones.
#
# The timeout is controlled on the Actions side: "timeout-minutes" below is
# the hard cap for the whole job, and CONAHCNUJ_MAX_SECONDS is kept just under
# it so the driver wraps up on its own and files its bug report (exit 1)
# before the runner kills the job. Bump both together when changing the budget.
#
# Least privilege for GITHUB_TOKEN: contents: read is all the runner needs for
# checkout and the opencode install. Every write the driver performs (feature
# branch, Verified commits, PR, review requests, comments, bug-report issues)
# goes through the GitHub App installation token from gh-app/get-token.sh,
# exactly like a local run.

on:
  issues:
    types: [opened, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
  # A failed required check is itself a reason to resume the driver: it re-runs,
  # sees the failing constraint and hands a fix round to the coding agent. The
  # trigger is the CI workflow's completion rather than check_run / check_suite:
  # those also fire for this driver's own run and would recurse, while
  # workflow_run lets the `on` side name the workflow to watch, and the job `if`
  # keeps only the failures (on a same-repository pull request).
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or pull request number to continue
        required: true
        type: number
  # Another repository drives one of its issues or pull requests by calling
  # this workflow. The job `if` below runs whenever `inputs.number` is set, and
  # the driver checkout follows this file (`job.workflow_repository` at
  # `job.workflow_sha`), not the caller. The target repository (`repository`,
  # defaulting to the caller) is checked out separately below and the driver
  # runs from inside it. Secrets are passed with `secrets: inherit` (same
  # organization or enterprise) or by name.
  workflow_call:
    inputs:
      number:
        description: Issue or pull request number to continue
        required: true
        type: number
      repository:
        description: 'owner/name of the repository to drive (default: the caller repository)'
        required: false
        type: string
      environment:
        description: 'Environment holding the GitHub App secrets (default: conahcnuj)'
        required: false
        type: string
        default: conahcnuj
      effort:
        description: 'Effort variant to use (e.g. "max"); empty uses the model default'
        required: false
        type: string
        default: ""
    secrets:
      APP_ID:
        required: true
      INSTALLATION_ID:
        required: true
      PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: conahcnuj-${{ inputs.number || github.event_name == 'issues' && github.event.issue.number || github.event_name == 'pull_request_review' && github.event.pull_request.number || (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number) }}
  cancel-in-progress: false

jobs:
  attempt:
    name: Attempt to resolve issue
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment || 'conahcnuj' }}
    if: >-
      inputs.number ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      (
        github.event_name == 'pull_request_review' &&
        github.event.pull_request.state == 'open' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.review.user.type != 'Bot' &&
        github.event.review.state != 'approved'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.pull_requests[0] != null
      )
    defaults:
      run:
        shell: bash
    steps:
      # Check out the driver source, i.e. this workflow's own repository: for
      # a cross-repository `workflow_call` the default checkout would be the
      # caller's repository, which has no driver. For this repository's own
      # events these are identical to the caller's repository and SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      # The coding agent edits the target repository, so when the target is not
      # the driver's own repository (a cross-repository call) check it out as
      # well and run the driver from inside it (see the last step). The driver's
      # git operations (branch creation, fetch, Verified commits) and the
      # agent's edits then all act on the target, matching a local run, instead
      # of on the driver checkout. For the driver's own repository the single
      # checkout above already is the target and is used as the working tree.
      - name: Check out the target repository
        if: ${{ (inputs.repository || github.repository) != job.workflow_repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository || github.repository }}
          path: target
          fetch-depth: 0

      # opencode is not preinstalled on runners; shared with ci.yml through the
      # install-opencode composite action (authenticated release lookup so
      # shared runner IPs do not hit the API rate limit).
      - name: Install opencode
        uses: ./.github/actions/install-opencode

      # The driver reads gh-app/app.env like any local run. The private key is
      # staged from the sealed secret, outside the work tree, so `git add -A`
      # can never pick it up. The App slug is not staged from a secret: it is
      # public (the <slug>[bot] login, and here also the repository name), and
      # a secret with that value made Actions mask the repository name in the
      # whole job log - the created PR URL included.
      - name: Stage App private key and app.env
        env:
          APP_ID: ${{ secrets.APP_ID }}
          INSTALLATION_ID: ${{ secrets.INSTALLATION_ID }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          pem="$RUNNER_TEMP/conahcnuj-app.pem"
          printf '%s\n' "$PRIVATE_KEY" > "$pem"
          chmod 600 "$pem"
          cat > gh-app/app.env <<EOF
          APP_ID="$APP_ID"
          INSTALLATION_ID="$INSTALLATION_ID"
          PRIVATE_KEY_PATH="$pem"
          BASH_EXE="/usr/bin/bash"
          EOF
          APP_SLUG="$(bash gh-app/app-slug.sh)"
          printf 'APP_SLUG="%s"\n' "${APP_SLUG}" >> gh-app/app.env

      - name: Run the conahcnuj driver
        env:
          # The repository to drive: the caller's repository for a reusable
          # call, unless the caller overrides it with `inputs.repository`. Set
          # explicitly (not left empty): for a cross-repository call the target
          # checkout below puts the driver's own repository name in origin, so
          # relying on origin detection would drive the wrong repository.
          CONAHCNUJ_REPO: ${{ inputs.repository || github.repository }}
          # When true the driver runs from the `target/` checkout (same value as
          # the target checkout step's `if`). For the driver's own repository it
          # runs from the workspace root, the driver checkout itself.
          CONAHCNUJ_CROSS_REPO: ${{ (inputs.repository || github.repository) != job.workflow_repository }}
          CONAHCNUJ_INPUT: ${{ inputs.number || github.event_name == 'issues' && github.event.issue.number || github.event_name == 'pull_request_review' && github.event.pull_request.number || (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number) }}
          # Just under the 60-minute job cap so the driver exits gracefully
          # and files its bug report before Actions kills the run.
          CONAHCNUJ_MAX_SECONDS: "3540"
          CONAHCNUJ_EFFORT: ${{ inputs.effort }}
          OPENCODE_DISABLE_AUTOUPDATE: "true"
        run: |
          [[ "${CONAHCNUJ_INPUT}" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid issue or pull request number: ${CONAHCNUJ_INPUT}" >&2; exit 1; }
          # Absolute path so the driver source is still found after cd'ing into
          # the target checkout; the driver resolves its own directory from it.
          driver="${PWD}/bin/conahcnuj.sh"
          if [[ "${CONAHCNUJ_CROSS_REPO}" == "true" ]]; then
            echo "Driving ${CONAHCNUJ_REPO} from the target checkout." >&2
            cd target
          fi
          bash "${driver}" "${CONAHCNUJ_INPUT}"
