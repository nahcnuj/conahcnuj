name: Issue auto-drive

# When an issue is created or reopened, a non-approval review is submitted,
# edited, or dismissed, a required check (the CI workflow) fails on a pull
# request, or the workflow is dispatched by hand, attempt to resolve it with the
# conahcnuj driver end-to-end (feature branch -> PR -> review feedback) and end
# with a ready-to-merge PR, or file a bug-report issue on failure.
#
# The timeout is controlled on the Actions side: "timeout-minutes" below is
# the hard cap for the whole job, and CONAHCNUJ_MAX_SECONDS is kept just under
# it so the driver wraps up on its own and files its bug report (exit 1)
# before the runner kills the job. Bump both together when changing the budget.
#
# Least privilege for GITHUB_TOKEN: contents: read is all the runner needs for
# checkout and the opencode install. Every write the driver performs (feature
# branch, Verified commits, PR, review requests, comments, bug-report issues)
# goes through the GitHub App installation token from gh-app/get-token.sh,
# exactly like a local run.

on:
  issues:
    types: [opened, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
  # A failed required check is itself a reason to resume the driver: it re-runs,
  # sees the failing constraint and hands a fix round to the coding agent. The
  # trigger is the CI workflow's completion rather than check_run / check_suite:
  # those also fire for this driver's own run and would recurse, while
  # workflow_run lets the `on` side name the workflow to watch, and the job `if`
  # keeps only the failures (on a same-repository pull request).
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or pull request number to continue
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: conahcnuj-${{ github.event_name == 'issues' && github.event.issue.number || github.event_name == 'pull_request_review' && github.event.pull_request.number || (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number) || inputs.number }}
  cancel-in-progress: false

jobs:
  attempt:
    name: Attempt to resolve issue
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: conahcnuj
    # Do not chase the driver's own outputs: its tracking issue and bug-report
    # issues are bot-authored and carry no `self-improvement` label, so they
    # stay skipped and the loop cannot recurse. The weekly findings issue is
    # bot-authored too but labelled, and that label is the one exception that
    # lets the self-improvement loop start the driver by itself. A job-level
    # `if` cannot read the `secrets` context (and APP_SLUG is not needed here),
    # so the check keys off the label, not a secret. Missing secrets are not
    # pre-checked either: the run fails loudly and the driver files its own bug
    # report (no silent skip).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        (
          github.event.issue.user.type != 'Bot' ||
          contains(github.event.issue.labels.*.name, 'self-improvement')
        )
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        github.event.pull_request.state == 'open' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.review.user.type != 'Bot' &&
        github.event.review.state != 'approved'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.pull_requests[0] != null
      )
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # opencode is not preinstalled on runners; shared with ci.yml through the
      # install-opencode composite action (authenticated release lookup so
      # shared runner IPs do not hit the API rate limit).
      - name: Install opencode
        uses: ./.github/actions/install-opencode

      # The driver reads gh-app/app.env like any local run. The private key is
      # staged from the sealed secret, outside the work tree, so `git add -A`
      # can never pick it up.
      - name: Stage App private key and app.env
        env:
          APP_ID: ${{ secrets.APP_ID }}
          INSTALLATION_ID: ${{ secrets.INSTALLATION_ID }}
          APP_SLUG: ${{ secrets.APP_SLUG }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          pem="$RUNNER_TEMP/conahcnuj-app.pem"
          printf '%s\n' "$PRIVATE_KEY" > "$pem"
          chmod 600 "$pem"
          cat > gh-app/app.env <<EOF
          APP_ID="$APP_ID"
          INSTALLATION_ID="$INSTALLATION_ID"
          APP_SLUG="$APP_SLUG"
          PRIVATE_KEY_PATH="$pem"
          BASH_EXE="/usr/bin/bash"
          EOF

      - name: Run the conahcnuj driver
        env:
          CONAHCNUJ_REPO: ${{ github.repository }}
          CONAHCNUJ_INPUT: ${{ github.event_name == 'issues' && github.event.issue.number || github.event_name == 'pull_request_review' && github.event.pull_request.number || (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number) || inputs.number }}
          # Just under the 60-minute job cap so the driver exits gracefully
          # and files its bug report before Actions kills the run.
          CONAHCNUJ_MAX_SECONDS: "3540"
          OPENCODE_DISABLE_AUTOUPDATE: "true"
        run: |
          [[ "${CONAHCNUJ_INPUT}" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid issue or pull request number: ${CONAHCNUJ_INPUT}" >&2; exit 1; }
          bash bin/conahcnuj.sh "${CONAHCNUJ_INPUT}"
