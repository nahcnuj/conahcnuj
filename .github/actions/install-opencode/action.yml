name: Install opencode
description: >
  Install the v2 opencode release this repository is built on. The v2
  installer is served from opencode.ai/v2/install (the v1 endpoint refuses
  v2 versions), so the latest v2 release is resolved via the authenticated
  GitHub CLI (avoids the shared-runner api.github.com rate limit) and that
  exact version is installed. Adds the opencode and conahcnuj bin dirs to
  PATH. Requires a prior actions/checkout step so the action can be
  referenced as ./.github/actions/install-opencode.

runs:
  using: composite
  steps:
    - name: Install opencode
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="$(gh release list --repo anomalyco/opencode --limit 50 --json tagName --jq '[.[] | select(.tagName|test("^v2\\.[0-9]+\\.[0-9]+$"))][0].tagName')"
        VER="${TAG#v}"
        test -n "$VER"
        curl -fsSL https://opencode.ai/v2/install | bash -s -- --version "$VER"
        echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
