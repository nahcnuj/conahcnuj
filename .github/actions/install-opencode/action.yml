name: Install opencode
description: >
  Resolve the latest opencode release via the authenticated API (unauthenticated
  api.github.com calls get rate-limited on shared runner IPs) and install it,
  adding the opencode and conahcnuj bin dirs to PATH. Requires a prior
  actions/checkout step so the action can be referenced as ./.github/actions/install-opencode.

runs:
  using: composite
  steps:
    - name: Install opencode
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/anomalyco/opencode/releases/latest | sed -n 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
        VER="${TAG#v}"
        test -n "$VER"
        curl -fsSL https://opencode.ai/install | bash -s -- --version "$VER"
        echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"