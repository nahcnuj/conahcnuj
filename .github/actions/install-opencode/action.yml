name: Install opencode
description: >
  Install an opencode release. The plugin, driver and e2e tests target the
  v2 CLI, whose run command has no --dir flag (the working directory is the
  process cwd) and uses lowercase --log-level values. Adds the opencode and
  conahcnuj bin dirs to PATH. Requires a prior actions/checkout step so the
  action can be referenced as ./.github/actions/install-opencode.

inputs:
  version:
    description: 'opencode version to install (e.g. 2.2.5)'
    required: true
    default: 2.2.5

runs:
  using: composite
  steps:
    - name: Install opencode
      shell: bash
      run: |
        curl -fsSL https://opencode.ai/v2/install | bash -s -- --version "${{ inputs.version }}"
        echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
